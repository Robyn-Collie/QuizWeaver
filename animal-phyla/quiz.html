/* ============================================================
   STATE
   ============================================================ */
const LS_KEY = "learn_animal-phyla_quiz";

let currentQ = 0;
let answers = [];    // { qId, correct:bool, userAnswer:any }
let quizStarted = false;
let quizFinished = false;

function saveState() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      currentQ, answers, quizStarted, quizFinished,
      ts: Date.now()
    }));
  } catch(e) { /* quota exceeded, ignore */ }
}

function loadState() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (s && typeof s.currentQ === "number") {
      currentQ = s.currentQ;
      answers = s.answers || [];
      quizStarted = !!s.quizStarted;
      quizFinished = !!s.quizFinished;
      return true;
    }
  } catch(e) {}
  return false;
}

function resetState() {
  currentQ = 0;
  answers = [];
  quizStarted = false;
  quizFinished = false;
  localStorage.removeItem(LS_KEY);
}

/* ============================================================
   UTILITY HELPERS
   ============================================================ */
const $ = (sel, ctx) => (ctx || document).querySelector(sel);
const $$ = (sel, ctx) => Array.from((ctx || document).querySelectorAll(sel));
const main = () => document.getElementById("main");

function formatNum(n, fn) {
  if (fn === "commas") return n.toLocaleString();
  return String(n);
}

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function updateProgress() {
  const wrap = document.getElementById("progressWrap");
  if (quizFinished || !quizStarted) {
    wrap.classList.add("hidden");
    return;
  }
  wrap.classList.remove("hidden");
  const n = currentQ + 1;
  document.getElementById("progressText").textContent = "Question " + n + " of " + TOTAL;
  const pct = Math.round((currentQ / TOTAL) * 100);
  document.getElementById("progressPct").textContent = pct + "%";
  document.getElementById("progressFill").style.width = pct + "%";
}

   RENDER: START SCREEN

/* ============================================================

   ============================================================ */
function renderQuestion() {
  if (currentQ >= TOTAL) {
    quizFinished = true;
    saveState();
    showResults();
    return;
  }
  updateProgress();
  const q = QUESTIONS[currentQ];
  switch (q.type) {
    case "slider": renderSlider(q); break;
    case "ordering": renderOrdering(q); break;
    case "matching": renderMatching(q); break;
    case "scenario": renderScenario(q); break;
    case "truefalse": renderTrueFalse(q); break;
  }
}

/* ============================================================
   TYPE 1: ESTIMATION SLIDER
   ============================================================ */
function renderSlider(q) {
  const mid = Math.round((q.min + q.max) / 2);
  let html = `<div class="question-card">
    <span class="q-type-badge badge-slider">Estimation</span>
    <div class="q-prompt">${q.prompt}</div>
    <div class="slider-wrap">
      <div class="slider-value" id="sliderVal">${formatNum(mid, q.formatFn)}${q.unit}</div>
      <input type="range" id="slider" min="${q.min}" max="${q.max}" step="${q.step}" value="${mid}">
      <div class="slider-labels">
        <span>${formatNum(q.min, q.formatFn)}</span>
        <span>${formatNum(q.max, q.formatFn)}</span>
      </div>
    </div>
    <div id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn">Submit</button>
      <button class="btn btn-secondary hidden" id="nextBtn">Next</button>
    </div>
  </div>`;
  main().innerHTML = html;

  const slider = document.getElementById("slider");
  const valEl = document.getElementById("sliderVal");
  slider.addEventListener("input", function() {
    valEl.textContent = formatNum(Number(this.value), q.formatFn) + q.unit;
  });

  document.getElementById("submitBtn").addEventListener("click", function() {
    this.classList.add("hidden");
    slider.disabled = true;
    const guess = Number(slider.value);
    const diff = Math.abs(guess - q.answer) / q.answer;
    let color, label;
    if (diff <= 0.10) { color = "correct-fb"; label = "Close!"; }
    else if (diff <= 0.25) { color = "partial-fb"; label = "Not bad!"; }
    else { color = "incorrect-fb"; label = "Way off!"; }

    const isCorrect = diff <= 0.10;
    answers.push({ qId: q.id, correct: isCorrect, userAnswer: guess });
    saveState();

    document.getElementById("feedback").innerHTML = `<div class="feedback-box ${color}">
      <strong>${label}</strong> The answer is <strong>${formatNum(q.answer, q.formatFn)}${q.unit}</strong>.
      Your guess: ${formatNum(guess, q.formatFn)}${q.unit} (${Math.round(diff*100)}% off).<br>${q.explanation}
    </div>`;
    document.getElementById("nextBtn").classList.remove("hidden");
  });

  document.getElementById("nextBtn").addEventListener("click", function() {
    currentQ++;
    saveState();
    renderQuestion();
  });
}

/* ============================================================
   TYPE 2: PROCESS ORDERING
   ============================================================ */
function renderOrdering(q) {
  const correctOrder = q.steps.slice();
  const shuffled = shuffleArray(q.steps.map((s, i) => ({ text: s, correctIdx: i })));
  let selectedOrder = [];

  function render() {
    let itemsHtml = shuffled.map((item, i) => {
      const orderPos = selectedOrder.indexOf(i);
      const isSelected = orderPos >= 0;
      return `<div class="order-item${isSelected ? ' selected' : ''}" data-idx="${i}">
        <span class="order-num">${isSelected ? (orderPos + 1) : ''}</span>
        <span class="order-text">${item.text}</span>
      </div>`;
    }).join('');

    let html = `<div class="question-card">
      <span class="q-type-badge badge-ordering">Ordering</span>
      <div class="q-prompt">${q.prompt}</div>
      <div class="ordering-pool" id="orderPool">${itemsHtml}</div>
      <button class="order-reset-btn" id="orderReset">Reset order</button>
      <div id="feedback"></div>
      <div class="btn-row">
        <button class="btn btn-primary" id="submitBtn" ${selectedOrder.length < shuffled.length ? 'disabled' : ''}>Submit</button>
        <button class="btn btn-secondary hidden" id="nextBtn">Next</button>
      </div>
    </div>`;
    main().innerHTML = html;

    $$('.order-item', main()).forEach(el => {
      el.addEventListener('click', function() {
        const idx = Number(this.dataset.idx);
        const pos = selectedOrder.indexOf(idx);
        if (pos >= 0) {
          selectedOrder.splice(pos, 1);
        } else {
          selectedOrder.push(idx);
        }
        render();
      });
    });

    document.getElementById("orderReset").addEventListener("click", function() {
      selectedOrder = [];
      render();
    });

    const submitBtn = document.getElementById("submitBtn");
    submitBtn.addEventListener("click", function() {
      submitOrdering();
    });

    document.getElementById("nextBtn").addEventListener("click", function() {
      currentQ++;
      saveState();
      renderQuestion();
    });
  }

  function submitOrdering() {
    const userOrder = selectedOrder.map(i => shuffled[i]);
    let correctCount = 0;
    userOrder.forEach((item, pos) => {
      if (item.correctIdx === pos) correctCount++;
    });
    const allCorrect = correctCount === correctOrder.length;

    answers.push({ qId: q.id, correct: allCorrect, userAnswer: selectedOrder.slice() });
    saveState();

    // Show results on each item
    const items = $$('.order-item', main());
    selectedOrder.forEach((shuffIdx, pos) => {
      const item = shuffled[shuffIdx];
      const el = items.find(e => Number(e.dataset.idx) === shuffIdx);
      if (el) {
        if (item.correctIdx === pos) {
          el.classList.add('correct');
        } else {
          el.classList.add('incorrect');
        }
      }
    });

    // Disable interactions
    $$('.order-item', main()).forEach(el => { el.style.pointerEvents = 'none'; });
    document.getElementById("orderReset").style.display = 'none';
    document.getElementById("submitBtn").classList.add("hidden");

    const fbClass = allCorrect ? "correct-fb" : (correctCount > 0 ? "partial-fb" : "incorrect-fb");
    const fbLabel = allCorrect ? "Perfect!" : `${correctCount} of ${correctOrder.length} correct.`;
    document.getElementById("feedback").innerHTML = `<div class="feedback-box ${fbClass}">
      <strong>${fbLabel}</strong> Correct order: ${correctOrder.join(' &rarr; ')}<br>${q.explanation}
    </div>`;
    document.getElementById("nextBtn").classList.remove("hidden");
  }

  render();
}

/* ============================================================
   TYPE 3: TERM MATCHING
   ============================================================ */
function renderMatching(q) {
  const leftItems = q.left.slice();
  const rightShuffled = shuffleArray(q.right.map((text, i) => ({ text, origIdx: i })));

  let activeSide = null; // 'left' or 'right'
  let activeIdx = null;
  let matched = []; // [{leftIdx, rightIdx}]
  let locked = false;

  function render() {
    const leftHtml = leftItems.map((text, i) => {
      const isMatched = matched.some(m => m.leftIdx === i);
      const isActive = activeSide === 'left' && activeIdx === i;
      return `<div class="match-item${isMatched ? ' matched' : ''}${isActive ? ' active' : ''}" data-side="left" data-idx="${i}">${text}</div>`;
    }).join('');

    const rightHtml = rightShuffled.map((item, i) => {
      const isMatched = matched.some(m => m.rightShufIdx === i);
      const isActive = activeSide === 'right' && activeIdx === i;
      return `<div class="match-item${isMatched ? ' matched' : ''}${isActive ? ' active' : ''}" data-side="right" data-idx="${i}">${item.text}</div>`;
    }).join('');

    let html = `<div class="question-card">
      <span class="q-type-badge badge-matching">Matching</span>
      <div class="q-prompt">${q.prompt}</div>
      <div class="matching-columns">
        <div>
          <div class="match-col-label">Terms</div>
          ${leftHtml}
        </div>
        <div>
          <div class="match-col-label">Matches</div>
          ${rightHtml}
        </div>
      </div>
      <div id="feedback"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="matchReset">Reset</button>
        <button class="btn btn-secondary hidden" id="nextBtn">Next</button>
      </div>
    </div>`;
    main().innerHTML = html;

    if (!locked) {
      $$('.match-item', main()).forEach(el => {
        el.addEventListener('click', function() {
          if (this.classList.contains('matched')) return;
          const side = this.dataset.side;
          const idx = Number(this.dataset.idx);
          handleMatchClick(side, idx);
        });
      });
    }

    document.getElementById("matchReset").addEventListener("click", function() {
      matched = [];
      activeSide = null;
      activeIdx = null;
      locked = false;
      render();
    });

    document.getElementById("nextBtn").addEventListener("click", function() {
      currentQ++;
      saveState();
      renderQuestion();
    });
  }

  function handleMatchClick(side, idx) {
    if (activeSide === null) {
      activeSide = side;
      activeIdx = idx;
      render();
      return;
    }

    if (activeSide === side) {
      if (activeIdx === idx) {
        activeSide = null;
        activeIdx = null;
      } else {
        activeIdx = idx;
      }
      render();
      return;
    }

    // Different side clicked -- attempt match
    let leftIdx, rightShufIdx;
    if (activeSide === 'left') {
      leftIdx = activeIdx;
      rightShufIdx = idx;
    } else {
      leftIdx = idx;
      rightShufIdx = activeIdx;
    }

    const rightOrigIdx = rightShuffled[rightShufIdx].origIdx;
    const isCorrectPair = q.pairs.some(p => p[0] === leftIdx && p[1] === rightOrigIdx);

    if (isCorrectPair) {
      matched.push({ leftIdx, rightShufIdx });
      activeSide = null;
      activeIdx = null;

      if (matched.length === q.left.length) {
        // All matched
        locked = true;
        answers.push({ qId: q.id, correct: true, userAnswer: "all matched" });
        saveState();
        render();
        document.getElementById("feedback").innerHTML = `<div class="feedback-box correct-fb">
          <strong>All matched correctly!</strong><br>${q.explanation}
        </div>`;
        document.getElementById("matchReset").classList.add("hidden");
        document.getElementById("nextBtn").classList.remove("hidden");
        return;
      }
      render();
    } else {
      // Flash wrong
      activeSide = null;
      activeIdx = null;
      render();
      const leftEl = $(`.match-item[data-side="left"][data-idx="${leftIdx}"]`, main());
      const rightEl = $(`.match-item[data-side="right"][data-idx="${rightShufIdx}"]`, main());
      if (leftEl) leftEl.classList.add('wrong');
      if (rightEl) rightEl.classList.add('wrong');
      setTimeout(() => {
        if (leftEl) leftEl.classList.remove('wrong');
        if (rightEl) rightEl.classList.remove('wrong');
      }, 600);
    }
  }

  // Auto-submit if user can't figure it all out — add a give-up after 5 wrong attempts
  // For simplicity, matching auto-completes or user can reset. If they navigate away unfinished we mark incomplete.
  // Actually, let's add a "Give Up" that shows after user has been at it:
  // Keep it simple -- just let them match. If they reset and re-try, that's fine.

  render();
}

   ============================================================ */
function renderScenario(q) {
  const letters = ['A', 'B', 'C', 'D'];
  let selected = null;

  let imgHtml = '';
  if (q.image) {
    imgHtml = `<img src="${q.image}" alt="${q.imageAlt || ''}" loading="lazy" class="quiz-img">`;
  }

  let html = `<div class="question-card">
    <span class="q-type-badge badge-scenario">Scenario</span>
    <div class="q-prompt">${q.prompt}</div>
    ${imgHtml}
    <div class="mc-options" id="mcOptions">
      ${q.options.map((opt, i) => `
        <div class="mc-option" data-idx="${i}">
          <span class="mc-letter">${letters[i]}</span>
          <span class="mc-text">${opt}</span>
        </div>
      `).join('')}
    </div>
    <div id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn" disabled>Submit</button>
      <button class="btn btn-secondary hidden" id="nextBtn">Next</button>
    </div>
  </div>`;
  main().innerHTML = html;

  $$('.mc-option', main()).forEach(el => {
    el.addEventListener('click', function() {
      if (document.getElementById("submitBtn").classList.contains("hidden")) return;
      $$('.mc-option', main()).forEach(e => e.classList.remove('selected'));
      this.classList.add('selected');
      selected = Number(this.dataset.idx);
      document.getElementById("submitBtn").disabled = false;
    });
  });

  document.getElementById("submitBtn").addEventListener("click", function() {
    if (selected === null) return;
    this.classList.add("hidden");
    const isCorrect = selected === q.answer;
    answers.push({ qId: q.id, correct: isCorrect, userAnswer: selected });
    saveState();

    $$('.mc-option', main()).forEach(el => {
      el.style.pointerEvents = 'none';
      const idx = Number(el.dataset.idx);
      if (idx === q.answer) el.classList.add('correct');
      if (idx === selected && !isCorrect) el.classList.add('wrong-selected');
    });

    const fbClass = isCorrect ? "correct-fb" : "incorrect-fb";
    const fbLabel = isCorrect ? "Correct!" : "Not quite.";
    document.getElementById("feedback").innerHTML = `<div class="feedback-box ${fbClass}">
      <strong>${fbLabel}</strong> ${q.explanation}
    </div>`;
    document.getElementById("nextBtn").classList.remove("hidden");
  });

  document.getElementById("nextBtn").addEventListener("click", function() {
    currentQ++;
    saveState();
    renderQuestion();
  });
}

/* ============================================================
   TYPE 5: TRUE/FALSE WITH TWIST
   ============================================================ */
function renderTrueFalse(q) {
  let selected = null;

  let html = `<div class="question-card">
    <span class="q-type-badge badge-truefalse">True / False</span>
    <div class="q-prompt">${q.prompt}</div>
    <div class="mc-options" id="tfOptions">
      <div class="mc-option" data-val="true">
        <span class="mc-letter">T</span>
        <span class="mc-text">True</span>
      </div>
      <div class="mc-option" data-val="false">
        <span class="mc-letter">F</span>
        <span class="mc-text">False</span>
      </div>
    </div>
    <div id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn" disabled>Submit</button>
      <button class="btn btn-secondary hidden" id="nextBtn">Next</button>
    </div>
  </div>`;
  main().innerHTML = html;

  $$('.mc-option', main()).forEach(el => {
    el.addEventListener('click', function() {
      if (document.getElementById("submitBtn").classList.contains("hidden")) return;
      $$('.mc-option', main()).forEach(e => e.classList.remove('selected'));
      this.classList.add('selected');
      selected = this.dataset.val === 'true';
      document.getElementById("submitBtn").disabled = false;
    });
  });

  document.getElementById("submitBtn").addEventListener("click", function() {
    if (selected === null) return;
    this.classList.add("hidden");
    const isCorrect = selected === q.answer;
    answers.push({ qId: q.id, correct: isCorrect, userAnswer: selected });
    saveState();

    $$('.mc-option', main()).forEach(el => {
      el.style.pointerEvents = 'none';
      const val = el.dataset.val === 'true';
      if (val === q.answer) el.classList.add('correct');
      if (val === selected && !isCorrect) el.classList.add('wrong-selected');
    });

    const fbClass = isCorrect ? "correct-fb" : "incorrect-fb";
    const fbLabel = isCorrect ? "Correct!" : "Not quite.";
    document.getElementById("feedback").innerHTML = `<div class="feedback-box ${fbClass}">
      <strong>${fbLabel}</strong> ${q.explanation}
    </div>`;
    document.getElementById("nextBtn").classList.remove("hidden");
  });

  document.getElementById("nextBtn").addEventListener("click", function() {
    currentQ++;
    saveState();
    renderQuestion();
  });
}

/* ============================================================
   RESULTS SCREEN
   ============================================================ */
function showResults() {
  updateProgress();
  const correct = answers.filter(a => a.correct).length;
  const pct = Math.round((correct / TOTAL) * 100);

  // Breakdown by type
  const types = ["slider", "ordering", "matching", "scenario", "truefalse"];
  const breakdown = {};
  types.forEach(t => { breakdown[t] = { total: 0, correct: 0 }; });
  answers.forEach(a => {
    const q = QUESTIONS.find(qq => qq.id === a.qId);
    if (q) {
      breakdown[q.type].total++;
      if (a.correct) breakdown[q.type].correct++;
    }
  });

  // SVG ring
  const radius = 70;
  const circ = 2 * Math.PI * radius;
  const offset = circ - (pct / 100) * circ;

  let scoreColor = pct >= 80 ? "var(--green)" : pct >= 50 ? "var(--yellow)" : "var(--red)";

  let breakdownHtml = types.map(t => {
    const b = breakdown[t];
    const typePct = b.total > 0 ? Math.round((b.correct / b.total) * 100) : 0;
    return `<div class="type-row">
      <span class="type-name">${TYPE_LABELS[t]}</span>
      <div class="type-bar-track">
        <div class="type-bar-fill" style="width:${typePct}%;background:${TYPE_COLORS[t]}"></div>
      </div>
      <span class="type-score">${b.correct}/${b.total}</span>
    </div>`;
  }).join('');

  let html = `<div class="results-screen">
    <div class="score-ring-wrap">
      <div class="score-ring">
        <svg width="160" height="160" viewBox="0 0 160 160">
          <circle class="track" cx="80" cy="80" r="${radius}"/>
          <circle class="fill-ring" cx="80" cy="80" r="${radius}"
            stroke-dasharray="${circ}"
            stroke-dashoffset="${circ}"
            style="stroke:${scoreColor}"
            id="scoreRing"/>
        </svg>
        <div class="score-text">
          <div class="score-pct" style="color:${scoreColor}">${pct}%</div>
          <div class="score-label">${correct} of ${TOTAL}</div>
        </div>
      </div>
    </div>
    <div class="type-breakdown">
      <h3>Score by Question Type</h3>
      ${breakdownHtml}
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="reviewBtn">Review Mistakes</button>
      <button class="btn btn-primary" id="retakeBtn">Retake Quiz</button>
    </div>
    <div id="reviewArea"></div>
  </div>`;
  main().innerHTML = html;

  // Animate ring
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      document.getElementById("scoreRing").style.strokeDashoffset = offset;
    });
  });

  document.getElementById("reviewBtn").addEventListener("click", function() {
    showReview();
  });

  document.getElementById("retakeBtn").addEventListener("click", function() {
    resetState();
    showStart();
  });
}

function showReview() {
  const wrong = answers.filter(a => !a.correct);
  if (wrong.length === 0) {
    document.getElementById("reviewArea").innerHTML = `<div class="feedback-box correct-fb" style="margin-top:1rem;">
      <strong>No mistakes!</strong> You got every question right. Amazing work!
    </div>`;
    return;
  }

  let items = wrong.map(a => {
    const q = QUESTIONS.find(qq => qq.id === a.qId);
    if (!q) return '';
    let yourAnswer = '';
    if (q.type === "slider") {
      yourAnswer = `Your estimate: ${formatNum(a.userAnswer, q.formatFn)}${q.unit || ''}. Correct: ${formatNum(q.answer, q.formatFn)}${q.unit || ''}`;
    } else if (q.type === "truefalse") {
      yourAnswer = `You said: ${a.userAnswer ? 'True' : 'False'}. Correct: ${q.answer ? 'True' : 'False'}`;
    } else if (q.type === "scenario") {
      yourAnswer = `You chose: ${q.options[a.userAnswer]}. Correct: ${q.options[q.answer]}`;
    } else if (q.type === "ordering") {
      yourAnswer = `Correct order: ${q.steps.join(' -> ')}`;
    } else if (q.type === "matching") {
      yourAnswer = `Some matches were incorrect.`;
    }
    return `<div class="review-item">
      <div class="review-q"><strong>Q${q.id}:</strong> ${q.prompt}</div>
      <div class="review-answer review-wrong">${yourAnswer}</div>
      <div class="feedback-box info-fb" style="margin-top:0.5rem;">${q.explanation}</div>
    </div>`;
  }).join('');

  document.getElementById("reviewArea").innerHTML = `<div class="review-list">
    <h3 style="margin-bottom:0.75rem;font-size:1rem;">Questions to Review (${wrong.length})</h3>
    ${items}
  </div>`;

  // Scroll to review
  document.getElementById("reviewArea").scrollIntoView({ behavior: 'smooth', block: 'start' });
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  const hasState = loadState();
  if (hasState && quizFinished) {
    showResults();
  } else if (hasState && quizStarted && currentQ < TOTAL) {
    renderQuestion();
  } else {
    resetState();
    showStart();
  }
}

// Handle matching questions that may not have been submitted
// If someone leaves a matching question and comes back, it won't have an answer recorded.
// On reload, if the currentQ points to a matching question with no answer, just re-render it.

init();

})();
</script>
