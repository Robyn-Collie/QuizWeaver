<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuizWeaver Learning Modules</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0f1117;--surface:#1a1d27;--accent:#4f8ef7;--text:#e2e8f0;--text-dim:#94a3b8;--border:#2d3348}
html{font-size:16px;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
body{min-height:100vh;padding:2rem 1rem}
.container{max-width:640px;margin:0 auto}
header{text-align:center;margin-bottom:2rem}
h1{font-size:1.75rem;margin-bottom:0.5rem}
.subtitle{color:var(--text-dim);font-size:0.9rem}
.module-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem;text-decoration:none;color:var(--text);display:block;transition:border-color 0.2s,transform 0.2s}
.module-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.module-card h2{font-size:1.1rem;margin-bottom:0.25rem}
.module-card .meta{color:var(--text-dim);font-size:0.8rem}
footer{text-align:center;color:var(--text-dim);font-size:0.75rem;margin-top:2rem}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>QuizWeaver Learning Modules</h1>
    <p class="subtitle">Interactive, research-backed learning tools for K-12 students</p>
  </header>
  <main>
    <a class="module-card" href="animal-phyla/">
      <h2>Animal Phyla</h2>
      <p class="meta">Grade 7 | Life Science | Virginia SOL LS.7</p>
    </a>
  </main>
  <footer>Powered by QuizWeaver</footer>
</div>
</body>
</html>
